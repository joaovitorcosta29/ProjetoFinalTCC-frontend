<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Cadastrar Manutenção - Sistema de Frota</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    </head>
    <body class="bg-light">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensagemSucesso}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Card de Cadastro -->
                    <div class="card shadow-sm border-0 rounded-3">
                        <div class="card-body p-4">
                            <h3 class="card-title fw-bold text-center mb-4 text-primary">Cadastrar Nova Manutenção</h3>

                            <form th:action="@{/manutencoes/salvar}" th:object="${manutencao}" method="post">
                                
                                <input type="hidden" th:field="*{idManutencao}" />
                                <input type="hidden" th:field="*{statusManutencao}" />

                                <!-- Seleção do Veículo Disponível -->
                                <div class="mb-3">
                                    <label for="idVeiculo" class="form-label fw-bold">Veículo</label>
                                    <select id="idVeiculo" class="form-select" th:field="*{idVeiculo}" required>
                                        <option value="">Selecione um veículo</option>
                                        <option th:each="v : ${veiculosDisponiveis}" 
                                                th:value="${v.idVeiculo}" 
                                                th:text="${v.idVeiculo + ' - ' + v.placa + ' (' + v.modelo + ')'}">
                                        </option>
                                    </select>
                                </div>

                                <!-- Descrição da Manutenção -->
                                <div class="mb-3">
                                    <label for="descricao" class="form-label fw-bold">Descrição do Serviço</label>
                                    <textarea id="descricao" th:field="*{descricao}" class="form-control" rows="3" 
                                              placeholder="Descreva detalhadamente o serviço ou motivo da manutenção..." required></textarea>
                                </div>

                                <!-- Botões de Ação -->
                                <div class="d-grid gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg fw-bold">Salvar Manutenção</button>
                                    <a th:href="@{/manutencoes/listar}" class="btn btn-outline-secondary">Ver manutenções cadastradas</a>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

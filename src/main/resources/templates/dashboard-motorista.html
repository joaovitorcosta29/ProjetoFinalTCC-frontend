<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Motorista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-2">
        <h3 class="mb-4">Painel do Motorista</h3>

        <div class="row g-4">
            <!-- Card Minhas Viagens -->
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3 h-100">
                    <h5>Minhas Viagens</h5>
                    <p class="text-muted">Assuma viagens disponíveis e finalize as que você já iniciou.</p>
                    <div class="mt-auto">
                        <a th:href="@{/viagens/minhas-viagens}" class="btn btn-outline-primary w-100 fw-bold">Ver Viagens</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

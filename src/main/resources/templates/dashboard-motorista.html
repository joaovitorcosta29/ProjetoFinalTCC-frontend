<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Motorista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Área do Motorista</a>
            <span class="navbar-text text-white">
                Olá, <strong th:text="${usuario.nome}">Motorista</strong>
            </span>
            <a href="/logout" class="btn btn-outline-light btn-sm ms-auto">Sair</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm text-center p-4">
                    <h4 class="mb-3">Minhas Rotas</h4>
                    <p>Confira as viagens disponiveis, inicie trechos e atualize o status da viagem.</p>
                    <a href="/viagens/listar" class="btn btn-success btn-lg">Minhas Viagens</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

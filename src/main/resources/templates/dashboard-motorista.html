<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard - Motorista</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">Área do Motorista</a>
                <span class="navbar-text text-white">
                    Olá, <strong th:text="${usuario.nome}">Motorista</strong>
                </span>
                <a href="/logout" class="btn btn-outline-light btn-sm ms-auto">Sair</a>
            </div>
        </nav>

        <div class="container">
            <div class="row justify-content-center">

                <!-- Card Manutencao -->
                <div class="col-md-4">
                    <div class="card shadow-sm text-center p-3 h-100">
                        <h5>Lista de Viagens</h5>
                        <p class="text-muted">Confira as viagens disponiveis.</p>
                        <div class="mt-auto">
                            <a href="/viagens/listar" class="btn btn-outline-primary w-100 fw-bold">Ver Viagens</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

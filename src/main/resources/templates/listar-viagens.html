<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Viagens</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    </head>
    <body class="bg-light">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-0">Viagens Cadastradas</h2>
                </div>

                <a th:if="${session.usuario != null and (session.usuario.cargo.name() == 'GESTOR_FROTA' or session.usuario.cargo.name() == 'ADMIN')}" 
                   th:href="@{/viagens/cadastrar}" 
                   class="btn btn-primary shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Cadastrar nova viagem
                </a>
            </div>

            <!-- Alerta de Sucesso -->
            <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensagemSucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Alerta de Erro -->
            <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white d-flex align-items-center">
                    <i class="bi bi-signpost-2 me-2"></i>
                    <span class="fw-semibold">Viagens</span>
                    <span class="badge bg-white text-primary ms-2" th:text="${#lists.size(viagens)}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID Viagem</th>
                                    <th>ID Usuário</th>
                                    <th>ID Veículo</th>
                                    <th>Cidade</th>
                                    <th>UF</th>
                                    <th>KM Inicial</th>
                                    <th>KM Final</th>
                                    <th>Status</th>
                                    <th>Alerta Manutenção</th>
                                    <th class="text-center">Editar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${viagens}">
                                    <td class="fw-bold" th:text="${v.idViagem != null ? '#' + v.idViagem : '-'}"></td>
                                    <td th:text="${v.idUsuario != null ? v.idUsuario : 'Não atribuído'}"></td>
                                    <td th:text="${v.idVeiculo}"></td>
                                    <td th:text="${v.cidadeDestino}"></td>
                                    <td th:text="${v.estadoDestino}"></td>
                                    <td th:text="${v.kmInicial}"></td>
                                    <td th:text="${v.kmFinal != null ? v.kmFinal : '-'}"></td>
                                    <td>
                                        <span th:if="${v.statusViagem != null and v.statusViagem.name() == 'DISPONIVEL'}" 
                                              class="badge bg-success">DISPONÍVEL</span>

                                        <span th:if="${v.statusViagem != null and (v.statusViagem.name() == 'EM_ANDAMENTO' or v.statusViagem.name() == 'EM_VIAGEM')}" 
                                              class="badge bg-warning text-dark">EM ANDAMENTO</span>

                                        <span th:if="${v.statusViagem != null and v.statusViagem.name() == 'FINALIZADA'}" 
                                              class="badge bg-secondary">FINALIZADA</span>
                                    </td>
                                    <td th:text="${v.alertaManutencao != null ? v.alertaManutencao : '-'}"></td>

                                    <td class="text-center">
                                        <a th:href="@{'/viagens/editar/' + ${v.idViagem}}"
                                           class="btn btn-sm btn-outline-primary shadow-sm">
                                            <i class="bi bi-pencil-square me-1"></i> Editar
                                        </a>                                     
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(viagens)}">
                                    <td colspan="10" class="text-center py-4 text-muted">
                                        Nenhuma viagem encontrada.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

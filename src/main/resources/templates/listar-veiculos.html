<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Gestão de Veículos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    </head>
    <body class="bg-light">
        
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        
        <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark mb-0">Veículos Cadastrados</h2>
                
                <!-- Botões agrupados lado a lado -->
                <div class="d-flex gap-2" th:if="${session.usuario != null and (session.usuario.cargo.name() == 'GESTOR_FROTA' or session.usuario.cargo.name() == 'ADMIN')}">
                    <a th:href="@{/veiculos/cadastrar}" class="btn btn-primary shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Cadastrar Veículo
                    </a>
                    <a th:href="@{/veiculos/editar}" class="btn btn-outline-primary shadow-sm">
                        <i class="bi bi-pencil-square me-1"></i> Editar Veículo
                    </a>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Placa</th>
                                    <th>Modelo</th>
                                    <th>Ano</th>
                                    <th>KM Atual</th>
                                    <th>Status Atual</th>
                                    <th>Alterar Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${veiculos}">
                                    <td th:text="${v.idVeiculo}">1</td>
                                    <td><strong th:text="${v.placa}">ABC-1234</strong></td>
                                    <td th:text="${v.modelo}">Torino</td>
                                    <td th:text="${v.anoFabricacao}">2022</td>
                                    <td th:text="${v.kmAtual + ' km'}">0.0 km</td>
                                    <td>
                                        <span th:if="${v.status.name() == 'DISPONIVEL'}" class="badge bg-success">DISPONÍVEL</span>
                                        <span th:if="${v.status.name() == 'EM_USO'}" class="badge bg-warning text-dark">EM USO</span>
                                        <span th:if="${v.status.name() == 'MANUTENCAO'}" class="badge bg-danger">MANUTENÇÃO</span>
                                        <span th:if="${v.status.name() == 'DESATIVADO'}" class="badge bg-secondary">DESATIVADO</span>
                                    </td>
                                    <td>
                                        <form th:action="@{/veiculos/alterar-status}" method="post" class="d-flex align-items-center gap-2">
                                            <input type="hidden" name="idVeiculo" th:value="${v.idVeiculo}">
                                            <select name="status" class="form-select form-select-sm w-auto" required>
                                                <option value="" disabled selected>Mudar para...</option>
                                                <option th:each="st : ${statuses}" 
                                                        th:value="${st}" 
                                                        th:text="${st}"
                                                        th:disabled="${st == v.status}"></option>
                                            </select>
                                            <button type="submit" class="btn btn-sm btn-outline-primary">Alterar</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(veiculos)}">
                                    <td colspan="7" class="text-center py-4 text-muted">
                                        Nenhum veículo cadastrado na frota.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

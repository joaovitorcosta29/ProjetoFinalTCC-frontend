<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Gestão de Veículos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    </head>
    <body class="bg-light">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container my-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-0">Veículos Cadastrados</h2>
                </div>

                <!-- Botão de Cadastro --> 
                <div th:if="${session.usuario != null and (session.usuario.cargo.name() == 'GESTOR_FROTA' or session.usuario.cargo.name() == 'ADMIN')}">
                    <a th:href="@{/veiculos/cadastrar}" class="btn btn-primary shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Cadastrar Veículo
                    </a>
                </div>
            </div>

            <!-- Mensagens de Alerta -->
            <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensagemSucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white d-flex align-items-center">
                    <i class="bi bi-truck-front me-2"></i>
                    <span class="fw-semibold">Veículos</span>
                    <span class="badge bg-white text-primary ms-2" th:text="${#lists.size(veiculos)}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Placa</th>
                                    <th>Modelo</th>
                                    <th>Ano</th>
                                    <th>KM Atual</th>
                                    <th>Status Atual</th>
                                    <th class="text-center" th:if="${session.usuario != null and (session.usuario.cargo.name() == 'GESTOR_FROTA' or session.usuario.cargo.name() == 'ADMIN')}">Editar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${veiculos}">
                                    <td th:text="${v.idVeiculo}">1</td>
                                    <td><strong th:text="${v.placa}">ABC-1234</strong></td>
                                    <td th:text="${v.modelo}">Torino</td>
                                    <td th:text="${v.anoFabricacao}">2022</td>
                                    <td th:text="${v.kmAtual + ' km'}">0.0 km</td>
                                    <td>
                                        <span th:if="${v.status.name() == 'DISPONIVEL'}" class="badge bg-success">DISPONÍVEL</span>
                                        <span th:if="${v.status.name() == 'EM_USO'}" class="badge bg-warning text-dark">EM USO</span>
                                        <span th:if="${v.status.name() == 'MANUTENCAO'}" class="badge bg-danger">MANUTENÇÃO</span>
                                        <span th:if="${v.status.name() == 'DESATIVADO'}" class="badge bg-secondary">DESATIVADO</span>
                                    </td>

                                    <td class="text-center" th:if="${session.usuario != null and (session.usuario.cargo.name() == 'GESTOR_FROTA' or session.usuario.cargo.name() == 'ADMIN')}">
                                        <a th:if="${v.status.name() != 'EM_USO'}" 
                                           th:href="@{/veiculos/editar/{id}(id=${v.idVeiculo})}" 
                                           class="btn btn-sm btn-outline-primary shadow-sm" 
                                           title="Editar Veículo">
                                            <i class="bi bi-pencil-square me-1"></i>Editar
                                        </a>

                                        <span th:if="${v.status.name() == 'EM_USO'}" class="text-muted small">
                                            <i class="bi bi-lock-fill"></i> Veiculo Indisponível
                                        </span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(veiculos)}">
                                    <td colspan="7" class="text-center py-4 text-muted">
                                        Nenhum veículo cadastrado na frota.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

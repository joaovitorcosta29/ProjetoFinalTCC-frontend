<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Veículo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5" style="max-width: 650px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 fs-5"><i class="bi bi-pencil-square me-2"></i>Editar Veículo</h4>
            </div>
            <div class="card-body p-4">

                <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/veiculos/atualizar}" th:object="${veiculo}" method="post">
                    
                    <input type="hidden" th:field="*{idVeiculo}" />

                    <div class="row g-3">
                        <!-- Placa -->
                        <div class="col-md-6">
                            <label for="placa" class="form-label fw-semibold">Placa</label>
                            <input type="text" id="placa" class="form-control" th:field="*{placa}" required placeholder="Ex: ABC-1234" minlength="8" maxlength="8" style="text-transform: uppercase;">
                        </div>

                        <!-- Modelo -->
                        <div class="col-md-6">
                            <label for="modelo" class="form-label fw-semibold">Modelo</label>
                            <input type="text" id="modelo" class="form-control" th:field="*{modelo}" required placeholder="Ex: Torino">
                        </div>

                        <!-- Ano de Fabricação -->
                        <div class="col-md-6">
                            <label for="anoFabricacao" class="form-label fw-semibold">Ano de Fabricação</label>
                            <input type="number" id="anoFabricacao" class="form-control" th:field="*{anoFabricacao}" required placeholder="Ex: 2022">
                        </div>

                        <!-- KM Atual -->
                        <div class="col-md-6">
                            <label for="kmAtual" class="form-label fw-semibold">KM Atual</label>
                            <input type="number" step="0.1" id="kmAtual" class="form-control" th:field="*{kmAtual}" required placeholder="Ex: 15000.0">
                        </div>

                        <!-- KM Última Manutenção (somente leitura) -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">KM Última Manutenção</label>
                            <input type="text" class="form-control" th:value="${veiculo.kmUltimaManutencao}" disabled readonly>
                            <div class="form-text">Atualizado automaticamente quando uma manutenção é concluída.</div>
                        </div>

                        <!-- Status do Veículo (somente leitura) -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Status do Veículo</label>
                            <input type="text" class="form-control" th:value="${veiculo.status}" disabled readonly>
                        </div>

                        <!-- Alerta de Manutenção (somente leitura, centralizado) -->
                        <div class="col-12">
                            <label class="form-label fw-semibold d-block">Alerta de Manutenção</label>
                            <div class="d-flex justify-content-center">
                                <span th:if="${veiculo.alertaManutencao != null and veiculo.alertaManutencao.name() == 'OK'}" class="badge bg-success fs-6 px-3 py-2">OK</span>
                                <span th:if="${veiculo.alertaManutencao != null and veiculo.alertaManutencao.name() == 'REVISAO_NECESSARIA'}" class="badge bg-danger fs-6 px-3 py-2">REVISÃO NECESSÁRIA</span>
                            </div>
                            <div class="form-text text-center">Calculado automaticamente com base na quilometragem rodada desde a última manutenção.</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/veiculos/listar}" class="btn btn-outline-primary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i> Salvar Alterações
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

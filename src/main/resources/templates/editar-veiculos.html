<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Veículo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5" style="max-width: 650px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between">
                <h4 class="mb-0 fs-5"><i class="bi bi-pencil-square me-2"></i>Editar Veículo</h4>
                <a th:href="@{/veiculos/listar}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-arrow-left me-1"></i> Voltar
                </a>
            </div>
            <div class="card-body p-4">

                <!-- Alerta de Erro -->
                <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/veiculos/atualizar}" th:object="${veiculo}" method="post">
                    
                    <input type="hidden" th:field="*{idVeiculo}" />

                    <div class="row g-3">
                        <!-- Placa -->
                        <div class="col-md-6">
                            <label for="placa" class="form-label fw-semibold">Placa</label>
                            <input type="text" id="placa" class="form-control" th:field="*{placa}" required placeholder="Ex: ABC-1234">
                        </div>

                        <!-- Modelo -->
                        <div class="col-md-6">
                            <label for="modelo" class="form-label fw-semibold">Modelo</label>
                            <input type="text" id="modelo" class="form-control" th:field="*{modelo}" required placeholder="Ex: Torino">
                        </div>

                        <!-- Ano de Fabricação -->
                        <div class="col-md-6">
                            <label for="anoFabricacao" class="form-label fw-semibold">Ano de Fabricação</label>
                            <input type="number" id="anoFabricacao" class="form-control" th:field="*{anoFabricacao}" required placeholder="Ex: 2022">
                        </div>

                        <!-- KM Atual -->
                        <div class="col-md-6">
                            <label for="kmAtual" class="form-label fw-semibold">KM Atual</label>
                            <input type="number" step="0.1" id="kmAtual" class="form-control" th:field="*{kmAtual}" required placeholder="Ex: 15000.0">
                        </div>

                        <!-- KM Última Manutenção -->
                        <div class="col-md-6">
                            <label for="kmUltimaManutencao" class="form-label fw-semibold">KM Última Manutenção</label>
                            <input type="number" step="0.1" id="kmUltimaManutencao" class="form-control" th:field="*{kmUltimaManutencao}" placeholder="Ex: 10000.0">
                        </div>

                        <!-- Status do Veículo -->
                        <div class="col-md-6">
                            <label for="status" class="form-label fw-semibold">Status do Veículo</label>
                            <select id="status" class="form-select" th:field="*{status}" required>
                                <option value="" disabled>Selecione um status...</option>
                                <option th:each="st : ${statusOptions}" 
                                        th:value="${st}" 
                                        th:text="${st}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Botões de Ação -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/veiculos/listar}" class="btn btn-outline-primary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i> Salvar Alterações
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

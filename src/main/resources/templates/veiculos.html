<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Veículos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- Navbar reaproveitada do fragmento -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container pb-5">

        <!-- Mensagens de Feedback -->
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${mensagemErro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Formulário de Cadastro -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Cadastrar Novo Veículo</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/veiculos/cadastrar}" th:object="${veiculo}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Placa</label>
                        <input type="text" th:field="*{placa}" class="form-control" placeholder="ABC-1234" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Modelo</label>
                        <input type="text" th:field="*{modelo}" class="form-control" placeholder="Ex: Fiorino" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Ano</label>
                        <input type="number" th:field="*{anoFabricacao}" class="form-control" placeholder="2022" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">KM Atual</label>
                        <input type="number" step="0.1" th:field="*{kmAtual}" class="form-control" placeholder="0.0" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">KM Últ. Manutenção</label>
                        <input type="number" step="0.1" th:field="*{kmUltimaManutencao}" class="form-control" placeholder="0.0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Status Inicial</label>
                        <select th:field="*{status}" class="form-select" required>
                            <option value="" disabled selected>Selecione um status...</option>
                            <option th:each="s : ${statuses}" 
                                    th:value="${s}" 
                                    th:text="${s}"></option>
                        </select>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-success px-4 fw-bold">Salvar Veículo</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela de Veículos -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="card-title mb-0">Frota Cadastrada</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Placa</th>
                                <th>Modelo</th>
                                <th>Ano</th>
                                <th>KM Atual</th>
                                <th>Status Atual</th>
                                <th>Alterar Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v : ${veiculos}">
                                <td th:text="${v.idVeiculo}">1</td>
                                <td><strong th:text="${v.placa}">ABC-1234</strong></td>
                                <td th:text="${v.modelo}">Fiorino</td>
                                <td th:text="${v.anoFabricacao}">2022</td>
                                <td th:text="${v.kmAtual + ' km'}">0.0 km</td>
                                <td>
                                    <span th:if="${v.status.name() == 'DISPONIVEL'}" class="badge bg-success">DISPONÍVEL</span>
                                    <span th:if="${v.status.name() == 'EM_USO'}" class="badge bg-warning text-dark">EM USO</span>
                                    <span th:if="${v.status.name() == 'MANUTENCAO'}" class="badge bg-danger">MANUTENÇÃO</span>
                                    <span th:if="${v.status.name() == 'DESATIVADO'}" class="badge bg-secondary">DESATIVADO</span>
                                </td>
                                <td>
                                    <!-- Form individual por linha para alterar status sem JS -->
                                    <form th:action="@{/veiculos/alterar-status}" method="post" class="d-flex align-items-center gap-2">
                                        <input type="hidden" name="idVeiculo" th:value="${v.idVeiculo}">
                                        <select name="status" class="form-select form-select-sm w-auto" required>
                                            <option value="" disabled selected>Mudar para...</option>
                                            <option th:each="st : ${statuses}" 
                                                    th:value="${st}" 
                                                    th:text="${st}"
                                                    th:disabled="${st == v.status}"></option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-outline-primary">Ok</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(veiculos)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    Nenhum veículo cadastrado na frota.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

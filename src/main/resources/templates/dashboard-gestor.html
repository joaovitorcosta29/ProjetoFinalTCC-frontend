<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gestor de Frota</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-2">
        <h3 class="mb-4">Painel Operacional da Frota</h3>
        
        <div class="row g-4">
            <!-- Card Gerenciar Veículos -->
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3 h-100">
                    <h5>Gerenciar Veículos</h5>
                    <p class="text-muted">Cadastre novos veículos e controle o status da frota.</p>
                    <div class="mt-auto">
                        <a th:href="@{/veiculos/listar}" class="btn btn-primary w-100 fw-bold">Acessar Frota</a>
                    </div>
                </div>
            </div>

            <!-- Card Cadastrar Nova Viagem -->
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3 h-100">
                    <h5>Cadastrar Nova Viagem</h5>
                    <p class="text-muted">Defina rotas, veículos e atribua motoristas.</p>
                    <div class="mt-auto">
                        <a th:href="@{/viagens/cadastrar}" class="btn btn-primary w-100 fw-bold">Nova Viagem</a>
                    </div>
                </div>
            </div>

            <!-- Card Viagens da Frota -->
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3 h-100">
                    <h5>Viagens da Frota</h5>
                    <p class="text-muted">Acompanhe e gerencie as viagens ativas.</p>
                    <div class="mt-auto">
                        <a th:href="@{/viagens/listar}" class="btn btn-outline-primary w-100 fw-bold">Ver Viagens</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

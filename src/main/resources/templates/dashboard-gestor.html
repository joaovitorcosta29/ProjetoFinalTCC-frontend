<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gestor de Frota</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Gestão de Frotas</a>
            <span class="navbar-text text-white">
                Gestor: <strong th:text="${usuario.nome}">Gestor</strong>
            </span>
            <a href="/logout" class="btn btn-outline-light btn-sm ms-auto">Sair</a>
        </div>
    </nav>

    <div class="container">
        <h3 class="mb-4">Painel Operacional da Frota</h3>
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card shadow-sm text-center p-3">
                    <h5>Cadastrar Nova Viagem</h5>
                    <p>Defina rotas, veículos e atribua motoristas.</p>
                    <a href="/viagens/cadastrar" class="btn btn-primary">Nova Viagem</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm text-center p-3">
                    <h5>Viagens da Frota</h5>
                    <p>Acompanhe e gerencie as viagens ativas.</p>
                    <a href="/viagens/listar" class="btn btn-outline-primary">Ver Viagens</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

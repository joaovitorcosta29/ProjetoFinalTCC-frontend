<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Viagem</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5" style="max-width: 650px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 fs-5"><i class="bi bi-pencil-square me-2"></i>Editar Viagem</h4>
            </div>
            <div class="card-body p-4">

                <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/viagens/atualizar}" th:object="${viagem}" method="post">

                    <input type="hidden" th:field="*{idViagem}" />

                    <div class="row g-3">
                        <!-- Veículo -->
                        <div class="col-12">
                            <label for="idVeiculo" class="form-label fw-semibold">Veículo</label>
                            <select id="idVeiculo" class="form-select" th:field="*{idVeiculo}" required>
                                <option value="" disabled>Selecione um veículo...</option>
                                <option th:each="veiculo : ${veiculos}"
                                        th:value="${veiculo.idVeiculo}"
                                        th:text="${veiculo.idVeiculo + ' - ' + veiculo.placa + ' (' + veiculo.modelo + ')'}">
                                </option>
                            </select>
                        </div>

                        <!-- Cidade Destino -->
                        <div class="col-md-8">
                            <label for="cidadeDestino" class="form-label fw-semibold">Cidade de Destino</label>
                            <input type="text" id="cidadeDestino" class="form-control" th:field="*{cidadeDestino}" required placeholder="Ex: Londrina">
                        </div>

                        <!-- UF -->
                        <div class="col-md-4">
                            <label for="estadoDestino" class="form-label fw-semibold">UF</label>
                            <select id="estadoDestino" class="form-select" th:field="*{estadoDestino}" required>
                                <option value="" disabled>Selecione...</option>
                                <option th:each="estado : ${estados}"
                                        th:value="${estado}"
                                        th:text="${estado}">
                                </option>
                            </select>
                        </div>

                        <!-- Status da Viagem (somente leitura) -->
                        <div class="col-12">
                            <label class="form-label fw-semibold">Status da Viagem</label>
                            <input type="text" class="form-control" th:value="${viagem.statusViagem}" disabled readonly>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/viagens/listar}" class="btn btn-outline-primary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i> Salvar Alterações
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Painel do Administrador</a>
            <span class="navbar-text text-white">
                Usuário: <strong th:text="${usuario.nome}">Admin</strong>
            </span>
            <a href="/logout" class="btn btn-outline-light btn-sm ms-auto">Sair</a>
        </div>
    </nav>

    <div class="container">
        <h3 class="mb-4">Administração Geral do Sistema</h3>
        <div class="row g-3">
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3">
                    <h5>Gerenciar Usuários</h5>
                    <p>Cadastre gestores, motoristas e administradores.</p>
                    <a href="/usuarios/listar" class="btn btn-danger">Acessar Usuários</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3">
                    <h5>Todas as Viagens</h5>
                    <p>Visão completa e relatórios de todas as viagens.</p>
                    <a href="/viagens/listar" class="btn btn-outline-danger">Acessar Viagens</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

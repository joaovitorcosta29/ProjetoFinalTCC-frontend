<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Início - Sistema de Viagens</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">Sistema de Viagens</a>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3" th:text="'Olá, ' + ${usuario.nome}">Olá, Usuário</span>
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Sair</a>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
                <div class="container-fluid py-3">
                    <h1 class="display-5 fw-bold">Bem-vindo ao Sistema</h1>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>

        <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/}">Gestão de Frota de Ônibus</a>
                <div class="d-flex align-items-center" th:with="cargoLegivel=${session.usuario != null ? (session.usuario.cargo.name() == 'GESTOR_FROTA' ? 'Gestor de Frota' : (session.usuario.cargo.name() == 'MOTORISTA' ? 'Motorista' : 'Administrador')) : ''}">
                    <div class="text-end me-3" th:if="${session.usuario != null}" style="line-height:1.25">
                        <div class="text-white fw-semibold" style="font-size:14px" th:text="${session.usuario.nome}"></div>
                        <div class="text-white-50" style="font-size:12px" th:text="${cargoLegivel}"></div>
                    </div>
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm" onclick="return confirm('Tem certeza que deseja sair?');">Sair</a>
                </div>
            </div>
        </nav>

    </body>
</html>

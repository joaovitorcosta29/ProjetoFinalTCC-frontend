<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Cadastrar Viagem - Sistema de Viagens</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 rounded-3">
                        <div class="card-body p-4">
                            <h3 class="card-title fw-bold text-center mb-4 text-primary">Cadastrar Nova Viagem</h3>

                            <form th:action="@{/viagens/salvar}" th:object="${viagem}" method="post">

                                <!-- Seleção do Veículo Disponível -->
                                <div class="mb-3">
                                    <label for="idVeiculo" class="form-label fw-bold">Veículo</label>
                                    <select id="idVeiculo" class="form-select" th:field="*{idVeiculo}" required>
                                        <option value="">Selecione um veículo</option>
                                        <option th:each="veiculo : ${veiculos}" 
                                                th:value="${veiculo.idVeiculo}" 
                                                th:text="${veiculo.idVeiculo + ' - ' + veiculo.placa + ' (' + veiculo.modelo + ')'}">
                                        </option>
                                    </select>
                                </div>

                                <div class="row">
                                    <div class="col-md-8 mb-3">
                                        <label for="cidadeDestino" class="form-label">Cidade de Destino</label>
                                        <input type="text" id="cidadeDestino" class="form-control" th:field="*{cidadeDestino}" placeholder="Ex: Londrina" required>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="estadoDestino" class="form-label">UF</label>
                                        <select id="estadoDestino" class="form-select" th:field="*{estadoDestino}" required>
                                            <option value="">Selecione</option>
                                            <option th:each="estado : ${estados}" 
                                                    th:value="${estado}" 
                                                    th:text="${estado}">
                                            </option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-grid gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg">Cadastrar Viagem</button>
                                    <a th:href="@{/viagens/listar}" class="btn btn-outline-secondary">Ver viagens cadastradas</a>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
